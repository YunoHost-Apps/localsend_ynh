#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "localsend"
name = "LocalSend"
description.en = "Alternative to AirDrop"
description.fr = "Alternative à AirDrop"

version = "2026.10.04~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "Apache-2.0"
website = "https://localsend.org/"
demo = "https://web.localsend.org/"
code = "https://github.com/localsend/web"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "500M"
ram.build = "1200M"
ram.runtime = "100M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    url = "https://github.com/localsend/web/archive/8fd3e7f6522f2ddc7c4cb0d237bb995ed95313c0.tar.gz"
    sha256 = "e72ac19b6316e9794a596e35da4413b47d12a9bd6b1fa378f77e5b398cd2e513"
    autoupdate.strategy = "latest_github_commit"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.nodejs]
    version = "24"
