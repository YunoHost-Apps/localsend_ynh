#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "localsend"
name = "LocalSend"
description.en = "Alternative to AirDrop"
description.fr = "Alternative à AirDrop"

version = "2026.08.20~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "Apache-2.0"
website = "https://localsend.org/"
demo = "https://web.localsend.org/"
code = "https://github.com/localsend/web"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "500M"
ram.build = "1200M"
ram.runtime = "100M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    url = "https://github.com/localsend/web/archive/4c48233f14f4918ef9129f27098640af25598986.tar.gz"
    sha256 = "58d976b07df1db5f24aaec9f421552a92405073f4ef5dc32e96fb7b7950857a4"
    autoupdate.strategy = "latest_github_commit"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.nodejs]
    version = "22"
